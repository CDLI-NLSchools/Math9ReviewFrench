<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mathématiques 9 : banque de questions d'entraînement</title>
<script>
/* Math9ReviewFrench now lives in the unified review app. Forward to it,
   preserving the visitor's query string and hash: an incoming course
   parameter wins, otherwise course=math-9-fr is supplied. Any other
   incoming parameters are appended unchanged. */
(function () {
  var base = "https://cdli-nlschools.github.io/ReviewApps/";
  var incoming = new URLSearchParams(location.search);
  var p = new URLSearchParams();
  if (!incoming.has("course")) p.set("course", "math-9-fr");
  incoming.forEach(function (value, key) { p.append(key, value); });
  var qs = p.toString();
  location.replace(base + (qs ? "?" + qs : "") + location.hash);
})();
</script>
</head>
<body>
<p>L'application de révision de mathématiques 9 a déménagé vers l'application de révision unifiée.
<a href="https://cdli-nlschools.github.io/ReviewApps/?course=math-9-fr">Continuer vers la révision de mathématiques 9</a>.</p>
</body>
</html>
